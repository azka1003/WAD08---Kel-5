<script src="data-kost.js"></script>

<script>
// ── Render semua kartu kost ──────────────────────────────────────
function renderKost(list) {
  const grid = document.getElementById('kost-grid');
  const noResult = document.getElementById('no-result');

  if (list.length === 0) {
    grid.innerHTML = '';
    noResult.classList.remove('hidden');
    return;
  }

  noResult.classList.add('hidden');
  grid.innerHTML = list.map(({ id, k }) => `
    <a href="detail-kost.html?id=${id}"
       onclick="saveKostId(${id})"
       class="bg-white rounded-xl overflow-hidden shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-200 cursor-pointer block">
      <img src="${k.photo}" alt="${k.name}" class="w-full h-52 object-cover">
      <div class="p-4">
        <div class="flex items-center gap-2 mb-1">
          <span class="bg-blue-50 text-blue-600 text-xs font-semibold px-2 py-0.5 rounded-full">${k.type}</span>
          <span class="bg-purple-50 text-purple-600 text-xs font-semibold px-2 py-0.5 rounded-full">${k.tier}</span>
        </div>
        <h3 class="font-semibold text-lg mb-1">${k.name}</h3>
        <p class="text-gray-500 mb-1 text-sm">📍 ${k.area}</p>
        <div class="flex items-center gap-1 mb-2">
          <span class="text-yellow-400 text-sm">${k.stars}</span>
          <span class="text-sm font-semibold text-gray-700">${k.rating}</span>
          <span class="text-xs text-gray-400">(${k.reviews} ulasan)</span>
        </div>
        <div class="flex items-center justify-between">
          <span class="font-bold text-green-600">${fmt(k.price)} / bulan</span>
          <span class="bg-green-600 text-white text-xs font-bold px-3 py-1 rounded-lg">Lihat Detail</span>
        </div>
      </div>
    </a>
  `).join('');
}

// ── Filter & pencarian ───────────────────────────────────────────
function filterKost() {
  const keyword  = document.getElementById('search-input').value.toLowerCase();
  const maxPrice = parseInt(document.getElementById('max-price').value) || Infinity;
  const tipeEl   = document.querySelector('input[name="tipe"]:checked');
  const tipe     = tipeEl ? tipeEl.value : '';
  const fasChecked = [...document.querySelectorAll('.filter-fas:checked')].map(cb => cb.value);

  const result = DATA.map((k, i) => ({ id: i + 1, k })).filter(({ k }) => {
    // keyword
    if (keyword && !k.name.toLowerCase().includes(keyword) && !k.area.toLowerCase().includes(keyword)) return false;
    // harga
    if (k.price > maxPrice) return false;
    // tipe kamar
    if (tipe && !k.roomTypes.some(r => r.name.toLowerCase().includes(tipe.toLowerCase()))) return false;
    // fasilitas
    if (fasChecked.length > 0) {
      const allFas = [...k.fasKamar, ...k.fasUmum].join(' ').toLowerCase();
      if (!fasChecked.every(f => allFas.includes(f.toLowerCase()))) return false;
    }
    return true;
  });

  renderKost(result);
}

function resetFilter() {
  document.getElementById('search-input').value = '';
  document.getElementById('max-price').value = '';
  document.querySelector('input[name="tipe"][value=""]').checked = true;
  document.querySelectorAll('.filter-fas').forEach(cb => cb.checked = false);
  filterKost();
}

// ── Init ─────────────────────────────────────────────────────────
filterKost();
</script>
